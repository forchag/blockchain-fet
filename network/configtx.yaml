Organizations:
  - &FarmOrg
    Name: FarmMSP
    ID: FarmMSP
    MSPDir: crypto-config/peerOrganizations/farm.tn/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('FarmMSP.admin', 'FarmMSP.peer', 'FarmMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('FarmMSP.admin', 'FarmMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('FarmMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('FarmMSP.member')"
    AnchorPeers:
      - Host: peer0.north.farm.tn
        Port: 7051
      - Host: peer0.south.farm.tn
        Port: 8051
      - Host: peer0.east.farm.tn
        Port: 9051
      - Host: peer0.west.farm.tn
        Port: 10051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: Signature
      Rule: "OR('FarmMSP.member')"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer0.farm.tn:7050
    - orderer1.farm.tn:8050
    - orderer2.farm.tn:9050
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  EtcdRaft:
    Consenters:
      - Host: orderer0.farm.tn
        Port: 7050
        ClientTLSCert: crypto-config/ordererOrganizations/farm.tn/orderers/orderer0.farm.tn/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/farm.tn/orderers/orderer0.farm.tn/tls/server.crt
      - Host: orderer1.farm.tn
        Port: 8050
        ClientTLSCert: crypto-config/ordererOrganizations/farm.tn/orderers/orderer1.farm.tn/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/farm.tn/orderers/orderer1.farm.tn/tls/server.crt
      - Host: orderer2.farm.tn
        Port: 9050
        ClientTLSCert: crypto-config/ordererOrganizations/farm.tn/orderers/orderer2.farm.tn/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/farm.tn/orderers/orderer2.farm.tn/tls/server.crt
    Options:
      TickInterval: 500ms
      ElectionTick: 10
      HeartbeatTick: 1
      MaxInflightBlocks: 5
      SnapshotIntervalSize: 16 MB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  FarmGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *FarmOrg
    Consortiums:
      FarmConsortium:
        Organizations:
          - *FarmOrg
  FarmChannel:
    Consortium: FarmConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *FarmOrg
