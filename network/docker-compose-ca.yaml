version: '3.8'

networks:
  farm-network:
    name: farm-network
    driver: bridge

services:
  ca.farm.tn:
    image: hyperledger/fabric-ca:1.5.7
    platform: linux/arm64
    container_name: ca.farm.tn
    hostname: ca.farm.tn
    command: sh -c 'fabric-ca-server start -b ${CA_BOOTSTRAP_USER:-admin}:${CA_BOOTSTRAP_PASSWORD:-adminpw} --port 7054'
    environment:
      FABRIC_CA_SERVER_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-farm
      FABRIC_CA_SERVER_PORT: 7054
      FABRIC_CA_SERVER_DEBUG: 'false'
      FABRIC_CA_SERVER_TLS_ENABLED: 'true'
      FABRIC_CA_SERVER_CSR_CN: ca.farm.tn
      FABRIC_CA_SERVER_CSR_HOSTS: ca.farm.tn,localhost
      FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS: 0.0.0.0:17054
      FABRIC_CA_SERVER_BCCSP_DEFAULT: SW
      FABRIC_CA_SERVER_BCCSP_SW_HASH: SHA2
      FABRIC_CA_SERVER_BCCSP_SW_SECURITY: 256
      GODEBUG: netdns=go
      GOMAXPROCS: '2'
    ports:
      - '7054:7054'
      - '17054:17054'
    volumes:
      - ./organizations/fabric-ca/farm:/etc/hyperledger/fabric-ca-server
    networks:
      - farm-network
