version: '3.8'

networks:
  farm-network:
    name: farm-network
    external: true

x-peer-base: &peer-base
  image: hyperledger/fabric-peer:2.5.6
  platform: linux/arm64
  environment: &peer-env
    FABRIC_CFG_PATH: /etc/hyperledger/fabric
    FABRIC_LOGGING_SPEC: INFO
    CORE_PEER_LOCALMSPID: FarmMSP
    CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
    CORE_PEER_TLS_ENABLED: 'true'
    CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
    CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
    CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
    CORE_LEDGER_STATE_STATEDATABASE: CouchDB
    CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: ${COUCHDB_USER:-farm}
    CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: ${COUCHDB_PASSWORD:-farmcouchpw}
    CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
    CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: farm-network
    CORE_CHAINCODE_EXECUTETIMEOUT: 30s
    CORE_CHAINCODE_STARTUPTIMEOUT: 300s
    GODEBUG: netdns=go
    GOMAXPROCS: '2'
  working_dir: /root
  command: peer node start
  volumes:
    - ./core.yaml:/etc/hyperledger/fabric/core.yaml:ro
    - /var/run/docker.sock:/host/var/run/docker.sock
  networks:
    - farm-network

x-couchdb-base: &couchdb-base
  image: couchdb:3.3
  platform: linux/arm64
  environment:
    COUCHDB_USER: ${COUCHDB_USER:-farm}
    COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-farmcouchpw}
    ERL_FLAGS: '+S 2:2'
  networks:
    - farm-network

services:
  couchdb.north.farm.tn:
    <<: *couchdb-base
    container_name: couchdb.north.farm.tn
    hostname: couchdb.north.farm.tn
    ports:
      - '5984:5984'
    volumes:
      - couchdb.north.farm.tn:/opt/couchdb/data
  peer0.north.farm.tn:
    <<: *peer-base
    container_name: peer0.north.farm.tn
    hostname: peer0.north.farm.tn
    depends_on:
      - couchdb.north.farm.tn
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.north.farm.tn
      CORE_PEER_ADDRESS: peer0.north.farm.tn:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.north.farm.tn:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.south.farm.tn:8051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.north.farm.tn:7051
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.north.farm.tn:5984
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
    ports:
      - '7051:7051'
      - '9443:9443'
    volumes:
      - ./core.yaml:/etc/hyperledger/fabric/core.yaml:ro
      - ./crypto-config/peerOrganizations/farm.tn/peers/peer0.north.farm.tn/msp:/etc/hyperledger/fabric/msp:ro
      - ./crypto-config/peerOrganizations/farm.tn/peers/peer0.north.farm.tn/tls:/etc/hyperledger/fabric/tls:ro
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer0.north.farm.tn:/var/hyperledger/production

  couchdb.south.farm.tn:
    <<: *couchdb-base
    container_name: couchdb.south.farm.tn
    hostname: couchdb.south.farm.tn
    ports:
      - '6984:5984'
    volumes:
      - couchdb.south.farm.tn:/opt/couchdb/data
  peer0.south.farm.tn:
    <<: *peer-base
    container_name: peer0.south.farm.tn
    hostname: peer0.south.farm.tn
    depends_on:
      - couchdb.south.farm.tn
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.south.farm.tn
      CORE_PEER_ADDRESS: peer0.south.farm.tn:8051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:8051
      CORE_PEER_CHAINCODEADDRESS: peer0.south.farm.tn:8052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:8052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.north.farm.tn:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.south.farm.tn:8051
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.south.farm.tn:5984
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:10443
    ports:
      - '8051:8051'
      - '10443:10443'
    volumes:
      - ./core.yaml:/etc/hyperledger/fabric/core.yaml:ro
      - ./crypto-config/peerOrganizations/farm.tn/peers/peer0.south.farm.tn/msp:/etc/hyperledger/fabric/msp:ro
      - ./crypto-config/peerOrganizations/farm.tn/peers/peer0.south.farm.tn/tls:/etc/hyperledger/fabric/tls:ro
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer0.south.farm.tn:/var/hyperledger/production

  couchdb.east.farm.tn:
    <<: *couchdb-base
    container_name: couchdb.east.farm.tn
    hostname: couchdb.east.farm.tn
    ports:
      - '7984:5984'
    volumes:
      - couchdb.east.farm.tn:/opt/couchdb/data
  peer0.east.farm.tn:
    <<: *peer-base
    container_name: peer0.east.farm.tn
    hostname: peer0.east.farm.tn
    depends_on:
      - couchdb.east.farm.tn
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.east.farm.tn
      CORE_PEER_ADDRESS: peer0.east.farm.tn:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.east.farm.tn:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.north.farm.tn:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.east.farm.tn:9051
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.east.farm.tn:5984
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:11443
    ports:
      - '9051:9051'
      - '11443:11443'
    volumes:
      - ./core.yaml:/etc/hyperledger/fabric/core.yaml:ro
      - ./crypto-config/peerOrganizations/farm.tn/peers/peer0.east.farm.tn/msp:/etc/hyperledger/fabric/msp:ro
      - ./crypto-config/peerOrganizations/farm.tn/peers/peer0.east.farm.tn/tls:/etc/hyperledger/fabric/tls:ro
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer0.east.farm.tn:/var/hyperledger/production

  couchdb.west.farm.tn:
    <<: *couchdb-base
    container_name: couchdb.west.farm.tn
    hostname: couchdb.west.farm.tn
    ports:
      - '8984:5984'
    volumes:
      - couchdb.west.farm.tn:/opt/couchdb/data
  peer0.west.farm.tn:
    <<: *peer-base
    container_name: peer0.west.farm.tn
    hostname: peer0.west.farm.tn
    depends_on:
      - couchdb.west.farm.tn
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.west.farm.tn
      CORE_PEER_ADDRESS: peer0.west.farm.tn:10051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:10051
      CORE_PEER_CHAINCODEADDRESS: peer0.west.farm.tn:10052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:10052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.north.farm.tn:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.west.farm.tn:10051
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.west.farm.tn:5984
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:12443
    ports:
      - '10051:10051'
      - '12443:12443'
    volumes:
      - ./core.yaml:/etc/hyperledger/fabric/core.yaml:ro
      - ./crypto-config/peerOrganizations/farm.tn/peers/peer0.west.farm.tn/msp:/etc/hyperledger/fabric/msp:ro
      - ./crypto-config/peerOrganizations/farm.tn/peers/peer0.west.farm.tn/tls:/etc/hyperledger/fabric/tls:ro
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer0.west.farm.tn:/var/hyperledger/production

volumes:
  couchdb.north.farm.tn:
  couchdb.south.farm.tn:
  couchdb.east.farm.tn:
  couchdb.west.farm.tn:
  peer0.north.farm.tn:
  peer0.south.farm.tn:
  peer0.east.farm.tn:
  peer0.west.farm.tn:
